name: AIdev Gateway CI/CD & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy"

      - name: Test Production Build
        run: npm run build
        env:
          DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy"
          INTERNAL_KEY_PREFIX: "sk-int-"
          CAPTCHA_SECRET: "ci_dummy_secret"
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef"

  deploy:
    name: Deploy to Remote VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Remote VPS Deployment
        uses: appleboy/ssh-action@v1.2.0
        if: "${{ env.VPS_HOST != '' }}"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            export PATH="/www/server/nodejs/v24.14.1/bin:$PATH"
            cd /www/wwwroot/aidev.weebinhub.biz.id
            bash deploy.sh
